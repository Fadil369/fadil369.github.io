<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>غير متصل — BrainSAIT</title>
<meta name="theme-color" content="#090a08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23090a08'/%3E%3Ctext x='50' y='62' font-family='Arial,sans-serif' font-size='36' fill='%23edf34a' text-anchor='middle'%3EEF%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#090a08;--card:#11120e;--ink:#f4f3e9;--muted:#a7a8a0;--emerald:#10b981;--teal:#0d9488;--accent:#edf34a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Almarai','Segoe UI',Tahoma,-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid #1c1d1a;border-radius:20px;padding:40px 32px;text-align:center;max-width:460px;box-shadow:0 20px 40px -10px rgba(0,0,0,.5)}
  .dot{width:12px;height:12px;background:var(--emerald);border-radius:50%;box-shadow:0 0 0 4px rgba(16,185,129,.35);display:inline-block;margin-bottom:16px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;color:var(--accent)}
  p{color:var(--muted);font-size:16px;line-height:1.7;margin-bottom:24px}
  .status{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid #232420;border-radius:999px;background:#141512;color:var(--ink);font-size:13px;margin-bottom:24px;font-weight:700}
  .status .led{width:8px;height:8px;border-radius:50%;background:#f43f5e;box-shadow:0 0 0 4px rgba(244,63,94,.2);animation:blink 1.5s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
  .actions{display:flex;gap:10px;justify-content:center}
  .btn{padding:12px 22px;border-radius:11px;font-size:14px;font-weight:800;cursor:pointer;border:none;text-decoration:none;display:inline-block}
  .btn--primary{background:linear-gradient(135deg,var(--emerald),var(--teal));color:#000}
  .btn--primary:hover{filter:brightness(1.08)}
  .btn--outline{background:transparent;color:var(--ink);border:1px solid #232420}
  .btn--outline:hover{background:#141512}
  .hint{margin-top:24px;font-size:12.5px;color:var(--mixed,var(--muted))}
  .lang{margin-top:20px}
  .lang a{color:var(--muted);text-decoration:none;margin:0 12px;font-size:13px}
  .lang a:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="card">
  <div class="dot" aria-hidden="true"></div>
  <h1 id="title">أنت غير متصل</h1>
  <p id="subtitle">لا يوجد اتصال بالإنترنت. تبقى بياناتك على هذا الجهاز — افتح صفحة محفوظة أو أعد الاتصال للمتابعة.</p>
  <div class="status" id="status" role="status"><span class="led" aria-hidden="true"></span>غير متصل</div>
  <div class="actions">
    <a href="/ar/" class="btn btn--primary">الصفحة الرئيسية</a>
    <button type="button" class="btn btn--outline" id="retryBtn">أعد المحاولة</button>
  </div>
  <p class="hint" id="hint">المسودات والنماذج المعبأة محفوظة على جهازك، وتُزامن عند عودة الاتصال.</p>
  <div class="lang">
    <a href="/offline/" lang="en">English</a> · <a href="/ar/">العربية</a>
  </div>
</div>
<script>
// Leave this page once the connection is back. Reloading /offline/ itself would loop every few seconds.
const HOME = location.pathname.startsWith('/ar/') ? '/ar/' : '/';
async function checkOnline(){
  try{
    const res = await fetch('/manifest.webmanifest', {cache:'no-store'});
    if(res.ok) location.replace(HOME);
  }catch(e){ /* still offline */ }
}
setInterval(checkOnline, 5000);
window.addEventListener('online', checkOnline);
document.getElementById('retryBtn').addEventListener('click', checkOnline);
</script>
</body>
</html>
