name: Site quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: Fadil369/B.I.Lab/.github/workflows/node-site.yml@c4fa07d0969927a0fe225b3b33d8ce807c0ab706 # switch to @v1 once tagged
    with:
      node-version: '24'
      pre-browser-commands: |
        npm test
        npm run verify:clinical-marketplace
        npm run test:acp
        npm run landing && git diff --exit-code -- index.html ar/index.html
        npm run build
        npm run verify:published
      php-version: '8.3'
      php-extensions: pdo_sqlite, curl, mbstring
      php-commands: php build-apply/tests/run.php
      browser-commands: |
        npm run verify:bpr-ux
        npm run verify:experience
      audit-level: high
