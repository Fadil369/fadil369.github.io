name: Site quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run verify:clinical-marketplace
      - run: npm run test:acp
      - run: npm run landing && git diff --exit-code -- index.html ar/index.html
      - run: npm run build
      - run: npm run verify:published
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:bpr-ux
      - run: npm run verify:experience
      - run: npm audit --include=dev --audit-level=high
