name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    uses: Fadil369/B.I.Lab/.github/workflows/claude-code.yml@c4fa07d0969927a0fe225b3b33d8ce807c0ab706 # switch to @v1 once tagged
    with:
      mode: review
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
