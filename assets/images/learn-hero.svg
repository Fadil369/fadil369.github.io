<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">BrainSAIT Learn — Knowledge Constellation</title>
  <desc id="desc">A premium dark futuristic illustration of books, learning paths and an AI knowledge constellation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050714"/><stop offset="0.55" stop-color="#10142a"/><stop offset="1" stop-color="#1d1021"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d98b"/><stop offset="0.5" stop-color="#e9a84d"/><stop offset="1" stop-color="#ff7a3d"/>
