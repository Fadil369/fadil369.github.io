vg><span>البحث</span></div><div class="ws-node awaiting" style="--i: 6;"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg><span>نفيس</span></div><div class="ws-node planned" style="--i: 7;"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users-round"><path d="M18 21a8 8 0 0 0-16 0"></path><circle cx="10" cy="8" r="5"></circle><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"></path></svg><span>الفريق</span></div><div class="ws-node planned" style="--i: 8;"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-graduation-cap"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg><span>الإرشاد</span></div><div class="ws-node planned" style="--i: 9;"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-clock"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"></path><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h5"></path><path d="M17.5 17.5 16 16.3V14"></path><circle cx="16" cy="16" r="6"></circle></svg><span>الفترات</span></div></section><section class="bpr-section"><div class="profile-section-label">النواة السريرية</div><div class="ws-grid"><article class="ws-card live"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-server"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"></rect><rect width="20" height="8" x="2" y="14" rx="2" ry="2"></rect><line x1="6" x2="6.01" y1="6" y2="6"></line><line x1="6" x2="6.01" y1="18" y2="18"></line></svg><span class="ws-status live">يعمل اليوم</span></div><h3>OpenEMR خاص ومخصص لك</h3><p>نسخة OpenEMR 7 معزولة لكل مقدم رعاية — نطاق فرعي وقاعدة بيانات وشهادة TLS خاصة ونسخ احتياطية مشفرة خارج الموقع — باسمك وبهوية برينسايت وتباين ألوان مناسب. تُجهَّز من السجل.</p><ul><li dir="auto">{spid}.emr.brainsait.de</li><li dir="auto">إطلاق SMART-on-FHIR</li><li dir="auto">المساعد مدمج في /copilot</li></ul><a class="ws-link" href="https://emr.brainsait.de/" target="_blank" rel="noreferrer">بوابة السجل الطبي<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></article><article class="ws-card live"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bot"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg><span class="ws-status live">يعمل اليوم</span></div><h3>مساعد برينسايت</h3><p>مساعد سريري مدمج بـ14 مهارة ثنائية اللغة، يعمل افتراضيًا على نماذج مستضافة على خادم برينسايت، فتبقى بيانات المرضى على ذلك الخادم. يقدّم مسودات؛ والطبيب يراجع ويعدّل ويحفظ.</p><ul><li dir="auto">14 مهارة — القائمة الكاملة أعلاه</li><li dir="auto">ملخصات ما قبل الزيارة من مواعيدك</li><li dir="auto">لكل سجل طبي ذاكرة مشفرة وسلسلة منشأ خاصة</li></ul></article><article class="ws-card live"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg><span class="ws-status live">يعمل اليوم</span></div><h3>تحويل الصوت العربي إلى نص</h3><p>أملِ بالعربية أو الإنجليزية: يحوّل التعرف على الكلام المحلي حديثك إلى مسودة SOAP أو يكتب في أي حقل. ويُنبّه حارس الدقة إلى أي دواء أو جرعة لم ترد في الإملاء أو الملف.</p><ul><li dir="auto">Whisper large-v3-turbo محليًا</li><li dir="auto">كاتب تلقائي ← SOAP</li></ul></article><article class="ws-card live"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-alert"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span class="ws-status live">يعمل اليوم</span></div><h3>قواعد السلامة Sentinel</h3><p>16 فحصًا حتميًا مع ذكر المصدر — الميتفورمين ومثبطات SGLT2 مقابل eGFR، وفرط البوتاسيوم مع حاصرات RAAS، و«الضربة الثلاثية» لمضادات الالتهاب، وتفاعل الحساسية، وأهداف الضغط وHbA1c وLDL، والمتابعة المتأخرة.</p></article></div></section><section class="bpr-section"><div class="profile-section-label">التكامل</div><div class="ws-grid"><article class="ws-card live"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layers"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg><span class="ws-status live">يعمل اليوم</span></div><h3>FHIR R4</h3><p>مقدمو الرعاية منشورون كموارد FHIR Practitioner وPractitionerRole وOrganization، ويتواصل السجل الطبي مع المساعد عبر FHIR بإطلاق SMART.</p><a class="ws-link" href="/ar/bpr/developers">FHIR والواجهات<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a></article><article class="ws-card awaiting"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg><span class="ws-status awaiting"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hourglass"><path d="M5 22h14"></path><path d="M5 2h14"></path><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path></svg>تكامل جارٍ</span></div><h3>التكامل مع نفيس</h3><p>الأهلية والموافقات المسبقة والمطالبات مباشرة من مساحة العمل — والتكامل جارٍ.</p></article><article class="ws-card awaiting"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open-check"><path d="M12 21V7"></path><path d="m16 12 2 2 4-4"></path><path d="M22 6V4a1 1 0 0 0-1-1h-5a4 4 0 0 0-4 4 4 4 0 0 0-4-4H3a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h6a3 3 0 0 1 3 3 3 3 0 0 1 3-3h6a1 1 0 0 0 1-1v-1.3"></path></svg><span class="ws-status awaiting"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hourglass"><path d="M5 22h14"></path><path d="M5 2h14"></path><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path></svg>تكامل جارٍ</span></div><h3>التحقق من اعتماد الهيئة</h3><p>قراءة الترخيص والمؤهلات مباشرة من الهيئة السعودية للتخصصات الصحية. التكامل جارٍ، وإلى أن يكتمل تظهر «لم تُقيَّم».</p></article></div><aside class="bpr-scfhs compact" role="note"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hourglass" aria-hidden="true"><path d="M5 22h14"></path><path d="M5 2h14"></path><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path></svg><div><strong>الترخيص والمؤهلات — التكامل مع الهيئة السعودية للتخصصات الصحية جارٍ</strong><div class="bpr-scfhs-links"><a href="https://scfhs.org.sa/ar/E-Services/regvaliddescription" target="_blank" rel="noreferrer" class="bpr-ext">التحقق من التسجيل لدى الهيئة<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></div></div></aside></section><section class="bpr-section"><div class="profile-section-label">الأدوات والمعرفة</div><div class="ws-grid"><article class="ws-card live"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calculator"><rect width="16" height="20" x="4" y="2" rx="2"></rect><line x1="8" x2="16" y1="6" y2="6"></line><line x1="16" x2="16" y1="14" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg><span class="ws-status live">يعمل اليوم</span></div><h3>أدوات التخصص</h3><p>قوائم تحقق ونماذج وقوالب معبأة مسبقًا وحاسبات سريرية (eGFR وCHA₂DS₂-VASc وNEWS2 وSOFA…) حسب تخصصك، قابلة للطباعة على A4 مع رمز تحقق مباشر. أدوات مرجعية — تُراجع وفق البروتوكول المحلي.</p><ul><li dir="auto">13 حزمة تخصصية</li><li dir="auto">15 حاسبة — eGFR وCHA₂DS₂-VASc وNEWS2 وSOFA…</li><li dir="auto">قوائم تحقق ونماذج وقوالب معبأة</li><li dir="auto">طباعة A4 مع رمز تحقق مباشر</li></ul><a class="ws-link" href="https://registry.brainsait.de/tools.php" target="_blank" rel="noreferrer">للأعضاء<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></article><article class="ws-card live"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-flask-conical"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"></path><path d="M6.453 15h11.094"></path><path d="M8.5 2h7"></path></svg><span class="ws-status live">يعمل اليوم</span></div><h3>صفحة البحث</h3><p>أعمالك مطابقة عبر DOI من ORCID وZenodo وHugging Face، وتُحتسب فقط عندما يذكر الناشر معرّف ORCID الخاص بك.</p><a class="ws-link" href="/ar/bpr/research">البحث<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a></article><article class="ws-card live"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pill"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg><span class="ws-status live">يعمل اليوم</span></div><h3>مركز المعرفة</h3><p>بحث الأدوية (RxNorm) ورف مراجع منتقاة.</p><a class="ws-link" href="https://registry.brainsait.de/knowledge.php" target="_blank" rel="noreferrer">افتح<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></article></div></section><section class="bpr-section"><div class="profile-section-label">الفرق والتعليم والعمل</div><div class="ws-grid"><article class="ws-card planned"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-handshake"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66"></path><path d="m18 15-2-2"></path><path d="m15 18-2-2"></path></svg><span class="ws-status planned">قادمًا</span></div><h3>مراجعة الأقران</h3><p>طلب وتقديم مراجعات منظمة للحالات والملاحظات بين مقدمي الرعاية، تُسجَّل على هوية BPR لكل منهم.</p></article><article class="ws-card planned"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users-round"><path d="M18 21a8 8 0 0 0-16 0"></path><circle cx="10" cy="8" r="5"></circle><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"></path></svg><span class="ws-status planned">قادمًا</span></div><h3>فريق الرعاية الخاص بك</h3><p>اختر أو أضف ممرضين وأخصائيي علاج تنفسي وموظفي استقبال وغيرهم إلى مساحة عملك، لكل منهم دوره وصلاحياته.</p><div class="ws-roles"><span>ممرضون</span><span>أخصائيو العلاج التنفسي</span><span>موظفو الاستقبال</span><span>صيادلة</span><span>فنيو المختبر</span><span>مرمّزون طبيون / دورة الإيرادات</span><span>أطباء متدربون</span></div></article><article class="ws-card planned"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-graduation-cap"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg><span class="ws-status planned">قادمًا</span></div><h3>الإرشاد والتدريب</h3><p>أرشد الزملاء وأدر جلسات تدريبية باستخدام الأدوات والحاسبات والحالات نفسها.</p></article><article class="ws-card planned"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-clock"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"></path><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h5"></path><path d="M17.5 17.5 16 16.3V14"></path><circle cx="16" cy="16" r="6"></circle></svg><span class="ws-status planned">قادمًا</span></div><h3>الفترات المتاحة</h3><p>انشر فترة تحتاج إلى تغطيتها، أو التقط أي فترة متاحة تناسب ملفك.</p></article><article class="ws-card planned"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shuffle"><path d="m18 14 4 4-4 4"></path><path d="m18 2 4 4-4 4"></path><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"></path><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"></path><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"></path></svg><span class="ws-status planned">قادمًا</span></div><h3>المطابقة</h3><p>مطابقة مقدمي الرعاية مع الفترات والفرق — والأطباء المتدربين مع المرشدين والتدويرات.</p></article></div></section><section class="bpr-panel"><div class="bpr-panel-head"><h2><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-wid
