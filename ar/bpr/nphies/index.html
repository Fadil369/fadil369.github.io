ي اللغة مبني على وثائق نفيس المصنفة عامة: كل رمز رفض بلغة واضحة، وفحص أولي على جهازك، وخطة حسب نوع منشأتك.</p></header><div class="nph-status" role="note"><span class="ws-status live">يعمل اليوم</span><span>هذا المكتب المرجعي</span><span class="ws-status awaiting">غير متصل</span><span>بوابة معاملات نفيس</span><small>هذا مرجع مستقل وفحوص أولية، وليس خدمة إرسال معاملات متصلة أو معتمدة من نفيس أو مجلس الضمان الصحي. يلزم التحقق من الإرشادات قبل الاستخدام التشغيلي.</small></div><nav class="nph-tabs" aria-label="أقسام مكتب نفيس"><button type="button" aria-current="page"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-search" aria-hidden="true"><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M4.268 21a2 2 0 0 0 1.727 1H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v3"></path><path d="m9 18-1.5-1.5"></path><circle cx="5" cy="14" r="3"></circle></svg>افهم سبب الرفض</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clipboard-check" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>افحص الرسالة</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>خطة الجاهزية</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-stethoscope" aria-hidden="true"><path d="M11 2v2"></path><path d="M5 2v2"></path><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"></path><path d="M8 15a6 6 0 0 0 12 0v-3"></path><circle cx="20" cy="10" r="2"></circle></svg>بيانات الممارس</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>ما الذي تغيّر</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>واجهة الوثائق</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-building2" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg>للعيادات والمستشفيات</button></nav><section class="bpr-panel" aria-labelledby="nph-decode"><h2 id="pr-nph-decode">ماذا يعني رمز الرفض، ومن يعالجه، وكيف؟</h2><p class="nph-lead">71 رمزًا رسميًا من أسباب الرفض بلغة واضحة. النص الرسمي من رموز نفيس، أما الشرح والخطوات فإرشادات من برينسايت.</p><div class="nph-search"><label for="nph-q"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><span class="sr-only">ابحث</span></label><input id="pr-nph-q" dir="auto" placeholder="رمز أو كلمة، مثل AD-1-8 أو الترخيص أو 1042" autocomplete="off" value=""></div><div class="nph-chips" role="group" aria-label="تصفية حسب الفئة"><button type="button" aria-pressed="true">الكل</button><button type="button" aria-pressed="false">إدارية وبيانات</button><button type="button" aria-pressed="false">التغطية والمنافع</button><button type="button" aria-pressed="false">الضرورة الطبية</button><button type="button" aria-pressed="false">التوثيق السريري</button><button type="button" aria-pressed="false">الفوترة والعقد</button></div><p class="nph-count" role="status">النتائج: 71</p><div class="nph-reasons"><details class="nph-reason" id="pr-r-AD-1-1"><summary><code dir="ltr">AD-1-1</code><span>التشخيص لا يناسب نوع هذه المنشأة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> راجع رمز التشخيص ونوع مقدم الخدمة في حسابك على نفيس، ثم صحّح الخطأ منهما.</p><dl><div><dt>المسؤول</dt><dd>الترميز الطبي</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Diagnosis is inconsistent with provider type</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-2"><summary><code dir="ltr">AD-1-2</code><span>التشخيص لا يناسب تخصص الطبيب المسجل.</span><em class="nph-tag">يخص بيانات الممارس</em></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> تأكد أن رمز التخصص المرسل في فريق الرعاية يطابق تخصص الطبيب المسجل.</p><dl><div><dt>المسؤول</dt><dd>اعتماد الممارسين</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Diagnosis is inconsistent with clinician specialty</dd></div></dl><p class="nph-note"><a href="/ar/bpr/nphies?tab=clinician" data-discover="true">تحقق من جاهزية بيانات الممارس</a>. يعرض BPR حالة الترخيص «لم تُقيَّم» إلى أن يكتمل التكامل مع الهيئة.</p></div></details><details class="nph-reason" id="pr-r-AD-1-3"><summary><code dir="ltr">AD-1-3</code><span>التشخيص لا يناسب نوع الزيارة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> ابدأ بمراجعة فئة الزيارة فكثيرًا ما تكون هي الخطأ، ثم راجع التشخيص.</p><dl><div><dt>المسؤول</dt><dd>الترميز الطبي</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Diagnosis is inconsistent with encounter type</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-4"><summary><code dir="ltr">AD-1-4</code><span>التشخيص في المطالبة لا يدعم هذه الخدمة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> اربط كل خدمة بالتشخيص الذي يبررها، ورمّز السبب الفعلي لطلبها.</p><dl><div><dt>المسؤول</dt><dd>الطبيب المعالج</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Diagnosis is inconsistent with service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-5"><summary><code dir="ltr">AD-1-5</code><span>لا يُتوقع أن يفوتر هذا النوع من المنشآت هذه الخدمة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> راجع نطاق ترخيص المنشأة والعقد، ثم تأكد من صحة رمز الخدمة.</p><dl><div><dt>المسؤول</dt><dd>عقود شركات التأمين</dd></div><div><dt>المسار</dt><dd><strong>راجع شركة التأمين.</strong> لن يحل تغيير الرمز هذه الحالة. راجع العقد والوقائع ثم تابعها مع شركة التأمين. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Service/procedure is inconsistent with provider type</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-6"><summary><code dir="ltr">AD-1-6</code><span>الخدمة لا تناسب تخصص الطبيب المسجل.</span><em class="nph-tag">يخص بيانات الممارس</em></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> تأكد ممن قدّم الخدمة، وأن المطالبة تذكر هذا الطبيب برمز التخصص الصحيح.</p><dl><div><dt>المسؤول</dt><dd>اعتماد الممارسين</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Service/procedure is inconsistent with clinician specialty</dd></div></dl><p class="nph-note"><a href="/ar/bpr/nphies?tab=clinician" data-discover="true">تحقق من جاهزية بيانات الممارس</a>. يعرض BPR حالة الترخيص «لم تُقيَّم» إلى أن يكتمل التكامل مع الهيئة.</p></div></details><details class="nph-reason" id="pr-r-AD-1-7"><summary><code dir="ltr">AD-1-7</code><span>الخدمة لا تناسب نوع الزيارة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> تأكد أن فئة الزيارة تطابق مكان تقديم الخدمة فعليًا.</p><dl><div><dt>المسؤول</dt><dd>الترميز الطبي</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Service/procedure is inconsistent with encounter type</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-8"><summary><code dir="ltr">AD-1-8</code><span>تسجيل الطبيب غير ساري أو منتهٍ لهذه الخدمة.</span><em class="nph-tag">يخص بيانات الممارس</em></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> تحقق من الترخيص لدى الهيئة في تاريخ الخدمة وحدّث سجل الممارس، ولا تُعد الإرسال إلا إذا كان ساريًا في ذلك التاريخ.</p><dl><div><dt>المسؤول</dt><dd>اعتماد الممارسين</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Clinician registration is invalid or expired</dd></div></dl><p class="nph-note"><a href="/ar/bpr/nphies?tab=clinician" data-discover="true">تحقق من جاهزية بيانات الممارس</a>. يعرض BPR حالة الترخيص «لم تُقيَّم» إلى أن يكتمل التكامل مع الهيئة.</p></div></details><details class="nph-reason" id="pr-r-AD-1-9"><summary><code dir="ltr">AD-1-9</code><span>بيانات المؤمَّن له في المطالبة لا تطابق سجل شركة التأمين.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> اعتمد رقم الهوية أو الإقامة مفتاحًا، وانسخ الاسم ورقم العضوية من رد الأهلية.</p><dl><div><dt>المسؤول</dt><dd>التسجيل</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Mismatch in member information</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-1"><summary><code dir="ltr">AD-2-1</code><span>تاريخ الميلاد يقع بعد تاريخ الخدمة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> ابحث عن تاريخ هجري أُدخل في حقل ميلادي، وأدخل التواريخ بتقويم واحد واجعل التحويل عند العرض فقط.</p><dl><div><dt>المسؤول</dt><dd>التسجيل</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Date of birth follows date of service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-2"><summary><code dir="ltr">AD-2-2</code><span>يُظهر السجل تاريخ وفاة قبل تاريخ الخدمة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> تحقق من هوية المريض ومن التاريخين، وإذا كانا صحيحين فصعّد الحالة قبل أي إعادة إرسال.</p><dl><div><dt>المسؤول</dt><dd>فريق المطالبات</dd></div><div><dt>المسار</dt><dd><strong>راجع شركة التأمين.</strong> لن يحل تغيير الرمز هذه الحالة. راجع العقد والوقائع ثم تابعها مع شركة التأمين. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Date of death precedes the date of service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-3"><summary><code dir="ltr">AD-2-3</code><span>قُدمت الخدمة قبل بدء التغطية.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> تحقق من الأهلية عند الحجز ثم في يوم الزيارة، وأبلغ المريض مسبقًا بأي تكلفة.</p><dl><div><dt>المسؤول</dt><dd>التسجيل</dd></div><div><dt>المسار</dt><dd><strong>نهائي في الغالب.</strong> لا تُعد الإرسال إلا إذا كانت بيانات المطالبة خاطئة، وإلا فسوِّ الأمر مع المريض وفق الوثيقة وامنع تكراره. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Date of service/procedure is prior to coverage effective date</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-4"><summary><code dir="ltr">AD-2-4</code><span>فُوترت الخدمة نفسها لهذا التاريخ من قبل.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> راجع حالة المطالبة قبل أي إرسال، فالتصحيح يكون عبر مطالبة سابقة لا مطالبة جديدة تمامًا.</p><dl><div><dt>المسؤول</dt><dd>فريق المطالبات</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Duplicate service/procedure code based on the date</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-5"><summary><code dir="ltr">AD-2-5</code><span>وصلت المطالبة بعد انتهاء مهلة التقديم.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> اعرف مهلة كل شركة، وراجع تقرير أعمار المطالبات أسبوعيًا، وقدّم يوميًا لا على دفعات نهاية الشهر.</p><dl><div><dt>المسؤول</dt><dd>فريق المطالبات</dd></div><div><dt>المسار</dt><dd><strong>راجع شركة التأمين.</strong> لن يحل تغيير الرمز هذه الحالة. راجع العقد والوقائع ثم تابعها مع شركة التأمين. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Time limit for submission has expired</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-6"><summary><code dir="ltr">AD-2-6</code><span>قُدمت الخدمة خارج فترة صلاحية الموافقة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> قارن تاريخ الخدمة بفترة الصلاحية، واطلب التمديد قبل الخدمة في المرات القادمة.</p><dl><div><dt>المسؤول</dt><dd>فريق المطالبات</dd></div><div><dt>المسار</dt><dd><strong>عالج الموافقة المسبقة.</strong> اطلب الموافقة أو عدّلها أو مدّدها، ويفضّل أن يتم ذلك قبل تقديم الخدمة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Service was performed outside authorization validity date</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-3-1"><summary><code dir="ltr">AD-3-1</code><span>لم تكن هذه الخدمة بحاجة إلى موافقة مسبقة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> لا تتابع الطلب، وقدّم المطالبة إذا كانت الخدمة مغطاة، وحدّث قائمة الخدمات التي تحتاج موافقة.</p><dl><div><dt>المسؤول</dt><dd>فريق المطالبات</dd></div><div><dt>المسار</dt><dd><strong>نهائي في الغالب.</strong> لا تُعد الإرسال إلا إذا كانت بيانات المطالبة خاطئة، وإلا فسوِّ الأمر مع المريض وفق الوثيقة وامنع تكراره. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Authorization not required for service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-3-2"><summary><code dir="ltr">AD-3-2</code><span>فُوترت رموز منفصلة في حين ينطبق رمز مجمّع واحد.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> استبدل البنود المنفصلة بالرمز المجمّع من قائمة SBS الحالية.</p><dl><div><dt>المسؤول</dt><dd>الترميز الطبي</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Use bundled code</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-3-3"><summary><code dir="ltr">AD-3-3</code><span>فُوترت خدمات الغرفة والطعام منفصلة عن الإقامة.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> احذف هذه البنود المنفصلة لأن الإقامة سخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Claim information is inconsistent with preauthorized services</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-6"><summary><code dir="ltr">BE-1-6</code><span>مبالغ المطالبة غير متطابقة حسابيًا.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> أعد حساب صافي كل بند: ((الكمية × سعر الوحدة) × المعامل) + الضريبة، واجعل الإجمالي مساويًا لمجموع البنود.</p><dl><div><dt>المسؤول</dt><dd>فريق المطالبات</dd></div><div><dt>المسار</dt><dd><strong>صحّح وأعد الإرسال.</strong> أرسل مطالبة جديدة تشير إلى الأصلية بوصفها مطالبة سابقة، ولا يُنظر إلا في النسخة الجديدة. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Calculation discrepancy</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-7"><summary><code dir="ltr">BE-1-7</code><span>فُوترت المطالبة وفق نظام فوترة غير صحيح.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> تأكد من نظام الفوترة مع الشركة، ويشمل ذلك ما إذا كنت في مرحلة DRG الموازية أو الفعلية.</p><dl><div><dt>المسؤول</dt><dd>عقود شركات التأمين</dd></div><div><dt>المسار</dt><dd><strong>راجع شركة التأمين.</strong> لن يحل تغيير الرمز هذه الحالة. راجع العقد والوقائع ثم تابعها مع شركة التأمين. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Incorrect billing regime</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-8"><summary><code dir="ltr">BE-1-8</code><span>لم يتبع الاعتراض الإجراء المطلوب أو تجاوز مهلته.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> راجع خطوات الاعتراض في العقد، وتابع مواعيد الاعتراض لكل مطالبة.</p><dl><div><dt>المسؤول</dt><dd>فريق المطالبات</dd></div><div><dt>المسار</dt><dd><strong>راجع شركة التأمين.</strong> لن يحل تغيير الرمز هذه الحالة. راجع العقد والوقائع ثم تابعها مع شركة التأمين. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Appeal procedures not followed or time limits not met</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-9"><summary><code dir="ltr">BE-1-9</code><span>تسترد شركة التأمين مبلغًا دُفع سابقًا.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> طابقه مع إشعارات الدفع، واطلب سبب الاسترداد كتابيًا.</p><dl><div><dt>المسؤول</dt><dd>عقود شركات التأمين</dd></div><div><dt>المسار</dt><dd><strong>راجع شركة التأمين.</strong> لن يحل تغيير الرمز هذه الحالة. راجع العقد والوقائع ثم تابعها مع شركة التأمين. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Recovery of Payment</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-10"><summary><code dir="ltr">BE-1-10</code><span>صنفت شركة التأمين هذه الحالة على أنها احتيال.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>ماذا تفعل</strong> توقف وصعّد الأمر فورًا إلى الالتزام والشؤون القانونية، ولا تُعد الإرسال ولا تعدّل أي سجل.</p><dl><div><dt>المسؤول</dt><dd>الالتزام</dd></div><div><dt>المسار</dt><dd><strong>راجع شركة التأمين.</strong> لن يحل تغيير الرمز هذه الحالة. راجع العقد والوقائع ثم تابعها مع شركة التأمين. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>النص الرسمي</dt><dd dir="ltr" class="nph-official">Fraud</dd></div></dl></div></details></div></section></div><footer class="bpr-footer"><div class="bpr-footer-main"><div class="bpr-footer-brand"><strong>BPR</strong><p>هوية مهنية موقّعة، وأدوات سريرية مترابطة، ودليل عام يمكن التحقق منه — مصنوع للممارسين الصحيين.</p></div><nav aria-label="روابط BPR في التذييل"><div><strong>استكشف</strong><a href="/ar/bpr/providers" data-discover="true">دليل مقدمي الرعاية</a><a href="/ar/slots" data
