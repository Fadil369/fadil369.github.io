ام عبر منصة السجل مباشرة، حيث تبقى بياناتك الشخصية ومستنداتك محمية. إليك ما يحدث خطوة بخطوة.</p><div class="profile-actions"><a class="profile-button primary" href="https://registry.brainsait.de/join.php" target="_blank" rel="noreferrer">ابدأ الانضمام<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a><a class="profile-button secondary" href="https://registry.brainsait.de/scfhs.php" target="_blank" rel="noreferrer">دليل تصنيف الهيئة<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></div></header><ol class="bpr-steps"><li><span>01</span><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-in"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" x2="3" y1="12" y2="12"></line></svg><div><h3>سجّل الدخول عبر ORCID</h3><p>يربطك معرّف ORCID بالسجل، وتؤكد ORCID ملكيته بنفسها.</p></div></li><li><span>02</span><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg><div><h3>سؤال واحد في كل شريحة</h3><p>معالج ثنائي اللغة يبدأ بالعربية يجمع ملفك العام.</p></div></
