d revenue-cycle tools.</li><li>Develop FHIR R4 / HL7 interoperability and bilingual claims workflows; NPHIES integration is ongoing.</li><li>Published brainsait-pyheart and brainsait-pybrain as open-source Python packages.</li></ul></article><article><div class="cv-role-head"><div><h3>Corporate Physician — RCM &amp; Claims Review</h3><strong>Al Hayat National Hospital · Saudi Arabia · 6 branches</strong></div><time>Oct 2024 — Present</time></div><ul><li>Review rejection output across six branches, contracted payers and Ministry of Health claims.</li><li>Analyse denial patterns and communicate corrective findings across clinical, billing and IT teams.</li><li>Prepare and oversee corrected-claim resubmission, strengthening the review-to-resubmission cycle.</li></ul></article><article><div class="cv-role-head"><div><h3>Critical Care &amp; ICU Physician</h3><strong>Anfas Medical Care Hospital · Riyadh</strong></div><time>Apr 2021 — Sep 2024</time></div><ul><li>Managed complex, critically ill patients using evidence-based protocols in high-acuity care.</li></ul></article><article><div class="cv-role-head"><div><h3>Neurosurgery Physician</h3><strong>Aster Sanad Hospital · Riyadh</strong></div><time>May 2018 — Jan 2021</time></div><ul><li>Contributed to multidisciplinary neurosurgical care, complex procedures and coordinated clinical handovers.</li></ul></article><article><div class="cv-role-head"><div><h3>Emergency Medicine Physician</h3><strong>Rafa Medical Center · Riyadh</strong></div><time>Jun 2016 — Jun 2018</time></div><ul><li>Delivered rapid assessment and acute care across high-pressure emergency presentations.</li></ul></article></section></div><aside class="cv-sidebar"><section class="cv-identity"><div class="cv-identity-text"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check"><path d="M20 13c0 5-3.5
