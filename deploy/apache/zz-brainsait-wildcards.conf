# Catch-all subdomains: every unknown *.brainsait.de / *.givc.de name lands somewhere real instead of an error.
# Loaded last, so named sites (registry, hub, elfadil, givc.de, nphies.de) keep priority.
<VirtualHost *:80>
    ServerName wildcard.brainsait.de
    ServerAlias *.brainsait.de *.givc.de
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName wildcard.brainsait.de
    ServerAlias *.brainsait.de
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wildcard-brainsait.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wildcard-brainsait.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    RewriteEngine On
    # verify.* is the credential verifier: a SPID opens the signature/status check for that provider.
    RewriteCond %{HTTP_HOST} ^verify\.brainsait\.de$ [NC]
    RewriteRule ^/((SA|BS)-[A-Z]{3}-\d{6})/?$ https://registry.brainsait.de/verify?spid=$1 [R=301,L,NE]
    RewriteCond %{HTTP_HOST} ^verify\.brainsait\.de$ [NC]
    RewriteRule ^ https://registry.brainsait.de/verify [R=301,L]
    RewriteCond %{HTTP_HOST} ^(idn|bpr|providers?)\.brainsait\.de$ [NC]
    RewriteRule ^ https://registry.brainsait.de/ [R=301,L]
    RewriteCond %{HTTP_HOST} ^(dashboard|status|grafana|supervisor|analytics)\.brainsait\.de$ [NC]
    RewriteRule ^ https://brainsait.de/hub/ [R=301,L]
    RewriteCond %{HTTP_HOST} ^(market|marketplace|shop|commercial)\.brainsait\.de$ [NC]
    RewriteRule ^ https://brainsait.daftra.com/home [R=301,L]
    RewriteCond %{HTTP_HOST} ^academy\.brainsait\.de$ [NC]
    RewriteRule ^ https://brainsait.de/academy/ [R=301,L]
    RewriteCond %{HTTP_HOST} ^(api|developers?|fhir|nphies|iris|iris-api)\.brainsait\.de$ [NC]
    RewriteRule ^ https://brainsait.de/developers/ [R=301,L]
    RewriteCond %{HTTP_HOST} ^portals?\.brainsait\.de$ [NC]
    RewriteRule ^ https://brainsait.de/portal/ [R=301,L]
    RewriteRule ^ https://brainsait.de/ [R=302,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName wildcard.givc.de
    ServerAlias *.givc.de
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wildcard-givc.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wildcard-givc.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^(dr\.)?fadi-ghareeb\.givc\.de$ [NC]
    RewriteRule ^ https://registry.brainsait.de/p/SA-PHY-000001 [R=301,L]
    RewriteCond %{HTTP_HOST} ^(dr\.)?farroukh-raza\.givc\.de$ [NC]
    RewriteRule ^ https://registry.brainsait.de/p/SA-PHY-000002 [R=301,L]
    # Any other provider, organisation, nurse or pharmacy name under givc.de: the registry directory.
    RewriteCond %{HTTP_HOST} ^(dr|nurse|org|pharma)\.[a-z0-9-]+\.givc\.de$ [NC]
    RewriteRule ^ https://registry.brainsait.de/directory.php [R=302,L]
    RewriteRule ^ https://givc.de/ [R=302,L]
</VirtualHost>
