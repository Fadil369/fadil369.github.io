# givc.de and nphies.de → https://brainsait.de/hub/ (owner decision 2026-10-25). The previous sites are in
# brainsait-proxy-le-ssl.conf (disabled) with their files in /var/www/givc and /var/www/nphies, if ever wanted
# back. Port 80 is served by brainsait-proxy.conf (→ HTTPS here; ACME HTTP-01 for the nphies.de cert passes
# through it). The nphies.de certificate covers givc.de, www.givc.de, nphies.de, www.nphies.de.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName givc.de
    ServerAlias www.givc.de nphies.de www.nphies.de
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/nphies.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/nphies.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    RewriteEngine On
    # 2026-11-13: paths survive the move. Registry-shaped paths keep their path and query on the registry host.
    RewriteRule ^/(p|fhir|api|verify|transparency|workspace)(/.*)?$ https://registry.brainsait.de/$1$2 [R=301,L]
    RewriteRule ^/directory/?$ https://registry.brainsait.de/directory.php [R=301,L]
    RewriteRule ^/registry\.json$ https://registry.brainsait.de/api/providers [R=301,L]
    RewriteRule ^/(robots\.txt|sitemap\.xml|favicon\.ico|apple-touch-icon\.png)$ https://brainsait.de/$1 [R=301,L]
    # Everything else lands on the matching brainsait.de page: NPHIES names on the developer page, GIVC on the hub.
    RewriteCond %{HTTP_HOST} ^(www\.)?nphies\.de$ [NC]
    RewriteRule ^ https://brainsait.de/developers/ [R=301,L]
    RewriteRule ^ https://brainsait.de/hub/ [R=301,L]
</VirtualHost>
</IfModule>
