# Apache reverse proxy for the BPR clinical ACP service (Node on 127.0.0.1:8787).
# Install to /etc/apache2/sites-available/ and enable with a2ensite (see README.md).
# Requires mod_proxy, mod_proxy_http, mod_ssl, mod_rewrite, mod_reqtimeout (all already loaded on this host).
<VirtualHost *:80>
    ServerName acp.brainsait.de
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName acp.brainsait.de
    ServerSignature Off

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wildcard-brainsait.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wildcard-brainsait.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Prompts are at most 16 kB; the agent may run for up to 120 s.
    LimitRequestBody 16384
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 150
    ProxyPass / http://127.0.0.1:8787/ connectiontimeout=5 timeout=150
    ProxyPassReverse / http://127.0.0.1:8787/

    # Security headers: the host-wide policy (conf-enabled/zz-brainsait-security.conf) and the service both set them, so
    # without this each would be sent twice, sometimes with conflicting values (and browsers resolve duplicates in
    # surprising ways: a repeated Referrer-Policy changes how forms send Origin). Exactly one copy of each is sent here.
    # HSTS repeats the host-wide value: keep it identical to that file.
    Header always unset Strict-Transport-Security
    Header unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always unset X-Content-Type-Options
    Header unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"
    Header always unset Referrer-Policy
    Header unset Referrer-Policy
    Header always set Referrer-Policy "no-referrer"
    Header always unset X-Frame-Options
    Header unset X-Frame-Options
    Header always set X-Frame-Options "DENY"
    Header always unset Permissions-Policy
    Header unset Permissions-Policy
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    # Never log query strings (the OAuth callback carries a one-time code) or request bodies (prompts).
    ErrorLog ${APACHE_LOG_DIR}/acp-error.log
    CustomLog ${APACHE_LOG_DIR}/acp-access.log "%h %t \"%m %U %H\" %>s %b"
</VirtualHost>
</IfModule>
