ment.</h2></div><div class="profile-journey"><article><time dir="ltr">2019 — now</time><div><h3>Founder &amp; CEO</h3><strong>BrainSAIT Ltd</strong><p>Building AI-native healthcare infrastructure, provider identity and interoperable clinical tools.</p></div></article><article><time dir="ltr">2024 — now</time><div><h3>Corporate Physician · RCM</h3><strong>Al Hayat National Hospital</strong><p>Claims-rejection review, analysis and resubmission across six branches and contracted payers.</p></div></article><article><time dir="ltr">2021 — 2024</time><div><h3>Critical Care &amp; ICU Physician</h3><strong>Anfas Medical Care Hospital</strong><p>High-acuity care that shaped practical documentation and clinical-handover requirements.</p></div></article><article><time dir="ltr">2018 — 2021</time><div><h3>Neurosurgery Physician</h3><strong>Aster Sanad Hospital</strong><p>Multidisciplinary neurosurgical care and coordination across clinical teams.</p></div></article><article><time dir="ltr">2016 — 2018</time><div><h3>Emergency Medicine Physician</h3><strong>Rafa Medical Center</strong><p>Rapid assessment and high-stakes decisions across acute presentations.</p></div></article><article><time>MBBS</time><div><h3>Bachelor of Medicine &amp; Surgery</h3><strong>International University of Africa</strong></div></article></div></section><section class="profile-section" id="pr-research"><div class="profile-section-label">04 · Research &amp; writing</div><div class="profile-section-heading"><h2>Research, traced to its author with proof.</h2></div><div class="profile-research-grid"><a class="profile-paper" href="https://doi.org/10.5281/zenodo.23606022" target="_blank" rel="noreferrer"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1
