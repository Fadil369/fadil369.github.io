 layer for value-based purchasing.</p><small class="ksa-needs">Unlocked by: SCFHS credential feed</small></article><article class="ws-card planned"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg><span class="ws-status planned">Opportunity</span></div><h3>Council of Health Insurance</h3><p class="ksa-alt"><bdi>مجلس الضمان الصحي</bdi></p><p>FHIR R4 PractitionerRole and signed credentials that NPHIES-era systems can read instead of re-keying.</p><small class="ksa-needs">Unlocked by: SCFHS licensing and CHI accreditation links</small></article><article class="ws-card planned"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg><span class="ws-status planned">Opportunity</span></div><h3>Tawuniya</h3><p class="ksa-alt"><bdi>التعاونية</bdi></p><p>Provider identity and privilege checks before claim adjudication.</p><small class="ksa-needs">Unlocked by: Privilege data from providers</small></article><article class="ws-card planned"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg><span class="ws-status planned">Opportunity</span></div><h3>Bupa Arabia</h3><p class="ksa-alt"><bdi>بوبا العربية</bdi></p><p>A verified-provider index behind referral routing.</p><small class="ksa-needs">Unlocked by: Specialty data via SCFHS</small></article></div></section><section class="bpr-section"><div class="profile-section-label"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-check2"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="m3 15 2 2 4-4"></path></svg> Licensing &amp; quality</div><div class="ws-grid"><article class="ws-card planned"><div class="ws-card-top"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg><span class="ws-status planned">Opportunity</span></div><h3>Saudi Commission for Health Specialties</h3><p class="ksa-alt"><bdi>الهيئة السعودية للتخصصات الصحية</bdi></p><p>An API-first FHIR R4 identity layer on top of SCFHS classification, verifiable on any phone.</p><small class="ksa-needs">Unlocked by: The official SCFHS credential integration BPR is waiting on</small></article><article class="ws-card planned"><div clas
