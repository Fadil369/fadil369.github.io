one" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-languages"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg><span>ع</span></button><button class="profile-menu" aria-expanded="false" aria-controls="profile-nav" aria-label="Menu"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg></button></div></header><nav class="bpr-subnav" aria-label="BPR apps"><span class="bpr-subnav-mark" aria-hidden="true">BPR</span><div><a class="" href="/bpr" data-discover="true">Overview</a><a class="" href="/bpr/workspace" data-discover="true">Workspace</a><a class="" href="/bpr/providers" data-discover="true">Directory</a><a class="" href="/slots" data-discover="true">Hospital slots</a><a aria-current="page" class="active" href="/bpr/nphies" data-discover="true">NPHIES desk</a><a class="" href="/bpr/ai" data-discover="true">AI &amp; models</a><a class="" href="/bpr/clinic" data-discover="true">Clinic reception</a><a class="" href="/bpr/saudi" data-discover="true">For organizations</a><a class="" href="/bpr/verify" data-discover="true">Verify</a><a class="" href="/bpr/ledger" data-discover="true">Ledger</a><a class="" href="/bpr/research" data-discover="true">Research</a><a class="" href="/bpr/developers" data-discover="true">FHIR &amp; API</a><a class="" href="/bpr/join" data-discover="true">Join</a></div></nav><div class="bpr-app-body"><header class="bpr-app-head"><div class="profile-eyebrow"><span></span>NPHIES desk</div><h1>Understand the rejection, fix it, and stop it coming back.</h1><p>A bilingual reference built from NPHIES documents labelled public: every rejection code in plain language, a pre-check that runs on your device, and a plan for your type of facility.</p></header><div class="nph-status" role="note"><span class="ws-status live">Live today</span><span>This reference desk</span><span class="ws-status awaiting">Ongoing integration</span><span>Sending transactions to NPHIES</span><small>Demonstration: the explanations and steps are BrainSAIT guidance still under review, so do not rely on them for a live claim decision. Independent reference. Not connected to or certified by NPHIES, and not issued by the Council of Health Insurance.</small></div><nav class="nph-tabs" aria-label="NPHIES desk sections"><button type="button" aria-current="page"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-search" aria-hidden="true"><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M4.268 21a2 2 0 0 0 1.727 1H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v3"></path><path d="m9 18-1.5-1.5"></path><circle cx="5" cy="14" r="3"></circle></svg>Decode a rejection</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clipboard-check" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>Pre-check a message</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>Readiness plan</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-stethoscope" aria-hidden="true"><path d="M11 2v2"></path><path d="M5 2v2"></path><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"></path><path d="M8 15a6 6 0 0 0 12 0v-3"></path><circle cx="20" cy="10" r="2"></circle></svg>Clinician data</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>What changed</button><button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>Docs API</button></nav><section class="bpr-panel" aria-labelledby="nph-decode"><h2 id="pr-nph-decode">What a rejection code means, who owns it, and how to respond</h2><p class="nph-lead">All 71 official rejection reasons in plain language. The official wording comes from the NPHIES code sets. The explanations and steps are BrainSAIT guidance.</p><div class="nph-search"><label for="nph-q"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><span class="sr-only">Search</span></label><input id="pr-nph-q" dir="auto" placeholder="A code or word, such as AD-1-8, licence or 1042" autocomplete="off" value=""></div><div class="nph-chips" role="group" aria-label="Filter by family"><button type="button" aria-pressed="true">All</button><button type="button" aria-pressed="false">Administrative and data</button><button type="button" aria-pressed="false">Coverage and benefits</button><button type="button" aria-pressed="false">Medical necessity</button><button type="button" aria-pressed="false">Clinical documentation</button><button type="button" aria-pressed="false">Billing and contract</button></div><p class="nph-count" role="status">71 shown</p><div class="nph-reasons"><details class="nph-reason" id="pr-r-AD-1-1"><summary><code dir="ltr">AD-1-1</code><span>The diagnosis does not fit this type of facility.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the coded diagnosis and the provider type on your NPHIES account, then correct whichever is wrong.</p><dl><div><dt>Who owns it</dt><dd>Medical coding</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Diagnosis is inconsistent with provider type</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-2"><summary><code dir="ltr">AD-1-2</code><span>The diagnosis does not fit the clinician's recorded specialty.</span><em class="nph-tag">Clinician data</em></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Confirm the practice code sent in the care team matches the clinician's registered specialty.</p><dl><div><dt>Who owns it</dt><dd>Credentialing</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Diagnosis is inconsistent with clinician specialty</dd></div></dl><p class="nph-note"><a href="/bpr/nphies?tab=clinician" data-discover="true">Check a clinician’s data readiness</a>. BPR shows licence status as “not assessed” until the SCFHS integration is complete.</p></div></details><details class="nph-reason" id="pr-r-AD-1-3"><summary><code dir="ltr">AD-1-3</code><span>The diagnosis does not fit the encounter type.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the encounter class first, because it is often the wrong field. Then recheck the diagnosis.</p><dl><div><dt>Who owns it</dt><dd>Medical coding</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Diagnosis is inconsistent with encounter type</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-4"><summary><code dir="ltr">AD-1-4</code><span>The diagnosis on the claim does not support this service.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Link each service to the diagnosis that justifies it, and code the real indication.</p><dl><div><dt>Who owns it</dt><dd>Treating clinician</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Diagnosis is inconsistent with service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-5"><summary><code dir="ltr">AD-1-5</code><span>This type of facility is not expected to bill this service.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the facility licence scope and the contract, then confirm the correct service code.</p><dl><div><dt>Who owns it</dt><dd>Payer contracts</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service/procedure is inconsistent with provider type</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-6"><summary><code dir="ltr">AD-1-6</code><span>The service does not fit the clinician's recorded specialty.</span><em class="nph-tag">Clinician data</em></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Confirm who performed the service and that the claim names that clinician with the right practice code.</p><dl><div><dt>Who owns it</dt><dd>Credentialing</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service/procedure is inconsistent with clinician specialty</dd></div></dl><p class="nph-note"><a href="/bpr/nphies?tab=clinician" data-discover="true">Check a clinician’s data readiness</a>. BPR shows licence status as “not assessed” until the SCFHS integration is complete.</p></div></details><details class="nph-reason" id="pr-r-AD-1-7"><summary><code dir="ltr">AD-1-7</code><span>The service does not fit the encounter type.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check that the encounter class matches where the service actually took place.</p><dl><div><dt>Who owns it</dt><dd>Medical coding</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service/procedure is inconsistent with encounter type</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-1-8"><summary><code dir="ltr">AD-1-8</code><span>The clinician's registration was invalid or expired for this service.</span><em class="nph-tag">Clinician data</em></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the licence with SCFHS for the date of service and update the practitioner record. Resend only if it was valid on that date.</p><dl><div><dt>Who owns it</dt><dd>Credentialing</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Clinician registration is invalid or expired</dd></div></dl><p class="nph-note"><a href="/bpr/nphies?tab=clinician" data-discover="true">Check a clinician’s data readiness</a>. BPR shows licence status as “not assessed” until the SCFHS integration is complete.</p></div></details><details class="nph-reason" id="pr-r-AD-1-9"><summary><code dir="ltr">AD-1-9</code><span>Member details on the claim do not match the insurer's record.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Use the national ID or Iqama as the key, and copy the name and member number from the eligibility response.</p><dl><div><dt>Who owns it</dt><dd>Registration</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Mismatch in member information</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-1"><summary><code dir="ltr">AD-2-1</code><span>The date of birth falls after the date of service.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Look for a Hijri date typed in a Gregorian field. Enter dates in one calendar and convert only on display.</p><dl><div><dt>Who owns it</dt><dd>Registration</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Date of birth follows date of service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-2"><summary><code dir="ltr">AD-2-2</code><span>The record shows a date of death before the date of service.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Verify the patient's identity and both dates. If the dates are right, escalate this before anything is resent.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Date of death precedes the date of service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-3"><summary><code dir="ltr">AD-2-3</code><span>The service happened before the coverage started.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Run an eligibility check at booking and again on the day, and tell the patient about any cost in advance.</p><dl><div><dt>Who owns it</dt><dd>Registration</dd></div><div><dt>Route</dt><dd><strong>Usually final.</strong> Resend only if the facts on the claim were wrong. Otherwise settle it with the patient under the policy and prevent it next time. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Date of service/procedure is prior to coverage effective date</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-4"><summary><code dir="ltr">AD-2-4</code><span>The same service was already billed for this date.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the claim's status before sending anything. Corrections go through a Prior Claim, not a brand-new claim.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Duplicate service/procedure code based on the date</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-5"><summary><code dir="ltr">AD-2-5</code><span>The claim arrived after the submission window closed.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Know each payer's window, review an ageing report weekly, and submit daily instead of in month-end batches.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Time limit for submission has expired</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-2-6"><summary><code dir="ltr">AD-2-6</code><span>The service took place outside the authorisation's valid dates.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Compare the service date with the validity period, and request an extension before the service next time.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Fix the authorisation.</strong> Request, amend or extend the authorisation. Do this before the service whenever you can. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service was performed outside authorization validity date</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-3-1"><summary><code dir="ltr">AD-3-1</code><span>This service did not need an authorisation.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Do not chase the request. Proceed with the claim if the service is covered, and update your authorisation list.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Usually final.</strong> Resend only if the facts on the claim were wrong. Otherwise settle it with the patient under the policy and prevent it next time. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Authorization not required for service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-AD-3-2"><summary><code dir="ltr">AD-3-2</code><span>Separate gible to provide this service under the policy.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the contract's service scope and the member's class of cover.</p><dl><div><dt>Who owns it</dt><dd>Payer contracts</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Provider is not eligible for the service</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-1-3"><summary><code dir="ltr">CV-1-3</code><span>The policy does not cover this diagnosis.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the table of benefits before the service, and confirm the diagnosis is coded correctly.</p><dl><div><dt>Who owns it</dt><dd>Registration</dd></div><div><dt>Route</dt><dd><strong>Usually final.</strong> Resend only if the facts on the claim were wrong. Otherwise settle it with the patient under the policy and prevent it next time. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Diagnosis is not covered</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-1-4"><summary><code dir="ltr">CV-1-4</code><span>The policy does not cover this service.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the table of benefits before the service, and agree any cost with the patient.</p><dl><div><dt>Who owns it</dt><dd>Registration</dd></div><div><dt>Route</dt><dd><strong>Usually final.</strong> Resend only if the facts on the claim were wrong. Otherwise settle it with the patient under the policy and prevent it next time. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service/procedure is not covered</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-1-5"><summary><code dir="ltr">CV-1-5</code><span>The record does not show the service met the urgency criteria.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Document why it was urgent, including the presentation, vital signs and the risk of waiting.</p><dl><div><dt>Who owns it</dt><dd>Treating clinician</dd></div><div><dt>Route</dt><dd><strong>Send supporting information.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service/procedure does not meet the criteria of urgency criteria</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-1-6"><summary><code dir="ltr">CV-1-6</code><span>The payer treats this as a pre-existing condition that is not covered.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the policy terms. If the record shows a later onset, send that evidence.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Send supporting information.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Pre-existing diagnosis/condition is not covered</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-1-7"><summary><code dir="ltr">CV-1-7</code><span>The payer says the pre-existing condition was not disclosed.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Record the onset accurately in the file, and raise the disclosure dispute with the payer.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Pre-existing diagnosis/condition was not disclosed</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-1-8"><summary><code dir="ltr">CV-1-8</code><span>The annual limit or a sublimit has been reached.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the remaining benefit before costly services, and tell the patient about any out-of-pocket amount.</p><dl><div><dt>Who owns it</dt><dd>Registration</dd></div><div><dt>Route</dt><dd><strong>Usually final.</strong> Resend only if the facts on the claim were wrong. Otherwise settle it with the patient under the policy and prevent it next time. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Annual limit/sublimit amount exceeded</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-1-9"><summary><code dir="ltr">CV-1-9</code><span>This consultation falls within the 14-day follow-up period.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> If it was a new, unrelated problem, make sure the diagnosis and the note show that clearly.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Send supporting information.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt> tion</dd></div><div><dt>Route</dt><dd><strong>Usually final.</strong> Resend only if the facts on the claim were wrong. Otherwise settle it with the patient under the policy and prevent it next time. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Benefit maximum for this time period or occurrence has been reached</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-3-2"><summary><code dir="ltr">CV-3-2</code><span>The service may be appropriate but is too frequent.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Document why this repeat was needed, and include the earlier result if it supports the case.</p><dl><div><dt>Who owns it</dt><dd>Treating clinician</dd></div><div><dt>Route</dt><dd><strong>Send supporting information.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service/procedure may be appropriate, but too frequent</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-3-3"><summary><code dir="ltr">CV-3-3</code><span>The service exceeds the number allowed in a lifetime.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the patient's history for the service, then document the clinical need if you dispute this.</p><dl><div><dt>Who owns it</dt><dd>Treating clinician</dd></div><div><dt>Route</dt><dd><strong>Send supporting information.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" clas rmation guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Milk Products do not meet coverage criteria</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-4-7"><summary><code dir="ltr">CV-4-7</code><span>The device does not match the service or procedure.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the device code and the procedure linked to it.</p><dl><div><dt>Who owns it</dt><dd>Medical coding</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Device is not consistent with the service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-4-8"><summary><code dir="ltr">CV-4-8</code><span>The refill was requested too soon.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the last dispense date and days of supply before refilling.</p><dl><div><dt>Who owns it</dt><dd>Pharmacy</dd></div><div><dt>Route</dt><dd><strong>Usually final.</strong> Resend only if the facts on the claim were wrong. Otherwise settle it with the patient under the policy and prevent it next time. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Refill too soon</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-4-9"><summary><code dir="ltr">CV-4-9</code><span>This item is already included in another service.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Remove the separate line, and keep a list of items included in each package.</p><dl><div><dt>Who owns it</dt><dd>Medical coding</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service/procedure/device/medication was included within another service/procedure</dd></div></dl></div></details><details class="nph-reason" id="pr-r-CV-4-10"><summary><code dir="ltr">CV-4-10</code><span>The device or medication is not approved by the Saudi FDA.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Use an SFDA-registered product, and check the code against the current list.</p><dl><div><dt>Who owns it</dt><dd>Pharmacy</dd></div><div><dt>Route</dt><dd><strong>Usually final.</strong> Resend only if the facts on the claim were wrong. Otherwise settle it with the patient under the policy and prevent it next time. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Device/medications is not approved by the Saudi FDA</dd></div></dl></div></details><details class="nph-reason" id="pr-r-MN-1-1"><summary><code dir="ltr">MN-1-1</code><span>The payer finds the service is not justified by clinical guidelines.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Send the clinical reasoning and the guideline you relied on, with the relevant results.</p><dl><div><dt>Who owns it</dt><dd>Treating clinician</dd></div><div><dt>Route</dt><dd><strong>Send supporting information.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service is not clinically justified based on clinical practice guideline, without additional supporting diagnosis ormation.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">History of present illness is inadequate or missing</dd></div></dl></div></details><details class="nph-reason" id="pr-r-SE-1-3"><summary><code dir="ltr">SE-1-3</code><span>The chief complaint is missing or inadequate.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Record a clear chief complaint for each visit, then send it.</p><dl><div><dt>Who owns it</dt><dd>Treating clinician</dd></div><div><dt>Route</dt><dd><strong>Send supporting information.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Chief complaint is inadequate or missing</dd></div></dl></div></details><details class="nph-reason" id="pr-r-SE-1-4"><summary><code dir="ltr">SE-1-4</code><span>The physical examination is missing or inadequate.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Send the examination findings that support the diagnosis.</p><dl><div><dt>Who owns it</dt><dd>Treating clinician</dd></div><div><dt>Route</dt><dd><strong>Send supporting information.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Physical examination is inadequate or missing</dd></div></dl></div></details><details class="nph-rea d a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Type of diagnosis is inadequate or missing</dd></div></dl></div></details><details class="nph-reason" id="pr-r-SE-1-8"><summary><code dir="ltr">SE-1-8</code><span>The treatment plan is missing or inadequate.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Send a treatment plan that explains how this service fits in.</p><dl><div><dt>Who owns it</dt><dd>Treating clinician</dd></div><div><dt>Route</dt><dd><strong>Send supporting information.</strong> After a complete response, send documents for the rejected or partly approved items. The payer reviews them and can reissue its response. <small dir="ltr">Claim Resubmission Through Supporting Information guide</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Treatment plan is inadequate or missing</dd></div></dl></div></details><details class="nph-reason" id="pr-r-SE-1-9"><summary><code dir="ltr">SE-1-9</code><span>The quantity of the service is missing or inappropriate.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Match the quantity to what was documented and delivered.</p><dl><div><dt>Who owns it</dt><dd>Medical coding</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Quantity of service/procedure is inappropriate or missing</dd></div></dl></div></details><details class="nph-reason" id="pr-r-SE-1-10"><summary><code dir="ltr">SE-1-10</code><span>The patient's occupation is missing or inappropriate.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Capture the occupation at registration using the NPHIES occupation codes.</p><dl><div><dt>Who owns it</dt><dd>Registration</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Patient occupation is inappropriate or missing</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-1"><summary><code dir="ltr">BE-1-1</code><span>The co-payment was not collected from the member.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Collect the co-payment at the visit, and report the correct patient share on the item.</p><dl><div><dt>Who owns it</dt><dd>Registration</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Co-pay was not collected from member</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-2"><summary><code dir="ltr">BE-1-2</code><span>The payer says the service was not performed.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the record. If it was not delivered, remove it. If it was, send the evidence.</p><dl><div><dt>Who owns it</dt><dd>Compliance</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Service was not performed</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-3"><summary><code dir="ltr">BE-1-3</code><span>The submission does not comply with your contract with this payer.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the contract terms and the price list loaded for this payer.</p><dl><div><dt>Who owns it</dt><dd>Payer contracts</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Submission not compliant with contractual agreement between provider &amp; payer</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-4"><summary><code dir="ltr">BE-1-4</code><span>Pre-authorisation was required and was not obtained.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Show each payer's list at ordering, and hold scheduling until the approval is attached.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Fix the authorisation.</strong> Request, amend or extend the authorisation. Do this before the service whenever you can. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Preauthorization is required and was not obtained</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-5"><summary><code dir="ltr">BE-1-5</code><span>The claim does not match what was authorised.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Match the code, side and quantity to the approval. If the plan changes, update the request first.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Claim information is inconsistent with preauthorized services</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-6"><summary><code dir="ltr">BE-1-6</code><span>The amounts on the claim do not add up.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Recalculate each item net as ((quantity × unit price) × factor) + tax, and make the total equal the sum of items.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Correct and resend.</strong> Send a new claim that references the original as a Prior Claim. Only the new version is considered. <small dir="ltr">Provider Portal Manual, section 6.9</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Calculation discrepancy</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-7"><summary><code dir="ltr">BE-1-7</code><span>The claim was billed under the wrong billing regime.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Confirm your billing regime with the payer, including whether you are in DRG shadow or actual billing.</p><dl><div><dt>Who owns it</dt><dd>Payer contracts</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Incorrect billing regime</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-8"><summary><code dir="ltr">BE-1-8</code><span>The appeal did not follow the procedure or missed its time limit.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Check the contract's appeal steps, and track appeal dates per claim.</p><dl><div><dt>Who owns it</dt><dd>Claims team</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Appeal procedures not followed or time limits not met</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-9"><summary><code dir="ltr">BE-1-9</code><span>The payer is recovering an earlier payment.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Reconcile it against the payment notices, and ask for the basis in writing.</p><dl><div><dt>Who owns it</dt><dd>Payer contracts</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Recovery of Payment</dd></div></dl></div></details><details class="nph-reason" id="pr-r-BE-1-10"><summary><code dir="ltr">BE-1-10</code><span>The payer has flagged this as fraud.</span></summary><div class="nph-reason-body"><p class="nph-do"><strong>What to do</strong> Stop and escalate to compliance and legal at once. Do not resend or change any record.</p><dl><div><dt>Who owns it</dt><dd>Compliance</dd></div><div><dt>Route</dt><dd><strong>Review with the payer.</strong> A code change will not settle this. Check the contract and the facts, then take it up with the payer. <small dir="ltr">BrainSAIT guidance</small></dd></div><div><dt>Official wording</dt><dd dir="ltr" class="nph-official">Fraud</dd></div></dl></div></details></div></section></div><footer class="bpr-footer"><div class="bpr-footer-main"><di
