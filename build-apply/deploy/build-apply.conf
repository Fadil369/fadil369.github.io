# build-apply.brainsait.de. Install as /etc/apache2/sites-available/build-apply.brainsait.de.conf (the name must sort
# before zz-brainsait-wildcards.conf so it wins over the *.brainsait.de catch-all), then a2ensite + reload.
<VirtualHost *:80>
    ServerName build-apply.brainsait.de
    Redirect permanent / https://build-apply.brainsait.de/
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName build-apply.brainsait.de
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wildcard-brainsait.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wildcard-brainsait.de/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    DocumentRoot /opt/build-apply/build-apply/public
    <Directory /opt/build-apply/build-apply/public>
        Require all granted
        Options -Indexes
        AllowOverride None
        FallbackResource /index.php
    </Directory>
    # Settings and secrets come from the environment file, never from the web root.
    SetEnv BUILD_APPLY_ENV /etc/build-apply.env
    SetEnv BUILD_APPLY_DATA /var/lib/brainsait/build-apply
    LimitRequestBody 32768
    ErrorLog ${APACHE_LOG_DIR}/build-apply-error.log
    # Access log is off on purpose: request lines can carry an application reference.
</VirtualHost>
</IfModule>
